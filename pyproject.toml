[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "douyin-downloader"
version = "1.0.0"
description = "Douyin video, photo and music downloader for personal learning"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "dxy"}]
dependencies = [
  "requests>=2.32.5,<3",
  "playwright>=1.56.0,<2",
  "Pillow>=12.0.0,<13",
  "imageio-ffmpeg>=0.6.0,<0.7",
]

[project.optional-dependencies]
build = ["pyinstaller==6.19.0"]
dev = ["ruff==0.17.0"]

[project.scripts]
douyin-downloader = "douyin_downloader.presentation.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[project.urls]
Repository = "https://github.com/jeesoul/douyin-downloader"
Issues = "https://github.com/jeesoul/douyin-downloader/issues"

[tool.setuptools.packages.find]
where = ["src"]

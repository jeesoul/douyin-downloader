name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m pip install ruff==0.17.0
      - run: python -m ruff check src tests scripts douyin_download.py
      - run: python -m ruff format --check src tests scripts douyin_download.py
      - run: python -m unittest discover -s tests -v
